name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Unix entry points
        shell: bash
        run: |
          bash -n install.sh
          python -m compileall -q chronicle

      - name: Check version consistency
        shell: bash
        run: |
          PYPROJECT=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(python -c "import chronicle;print(chronicle.__version__)")
          echo "pyproject=$PYPROJECT package=$PACKAGE"
          test "$PYPROJECT" = "$PACKAGE"

      - name: Run test suite
        run: python -m pytest -q
